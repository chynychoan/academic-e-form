<html lang="en">
<head>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            font-family: 'Inter', sans-serif;
            user-select: none;
        }

        /* Animated gradient background canvas overlay */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Radial glow around center logo */
        .glow-effect {
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.15), 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        /* Sub-node hover glow */
        .node-glow {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease, background-color 0.3s ease;
        }

        .node-glow:hover {
            transform: var(--hover-transform) !important;
            box-shadow: 0 20px 30px -5px rgba(0, 0, 0, 0.4), 0 0 25px rgba(255, 255, 255, 0.8);
            background-color: #f8fafc;
        }

        /* Custom SVG Aii Logo Style */
        .aii-text-color {
            fill: #0c567d;
        }

        /* Hover Container & Interactive Invisible Hover Bridge */
        .hub-container {
            position: relative;
            width: 320px;
            height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Extended hit area bridge to prevent menu from closing when moving mouse from logo to sub-buttons */
        .hub-container::before {
            content: '';
            position: absolute;
            top: -120px;
            left: -80px;
            right: -80px;
            bottom: 0;
            border-radius: 50% 50% 0 0;
            z-index: 1;
            pointer-events: none;
        }

        .hub-container:hover::before,
        .hub-container.active::before {
            pointer-events: auto;
        }

        /* Popup Sub-Buttons Base Styles & Interactive Anchor Tags */
        .sub-node {
            position: absolute;
            width: 115px;
            height: 115px;
            border-radius: 50%;
            background: white;
            color: #0c567d;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 12px;
            font-size: 0.8rem;
            font-weight: 700;
            line-height: 1.2;
            cursor: pointer;
            opacity: 0;
            transform: translate(0, 20px) scale(0.2);
            pointer-events: none;
            transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.35s ease;
            z-index: 20;
            text-decoration: none;
            outline: none;
        }

        /* When trigger / parent hover is active, popup sub-nodes into position */
        .hub-container:hover .sub-node,
        .hub-container.active .sub-node {
            opacity: 1;
            pointer-events: auto;
        }

        /* Left Sub Node (Teaching Supply) */
        .sub-node-1 {
            --hover-transform: translate(-135px, -115px) scale(1.12);
        }
        .hub-container:hover .sub-node-1,
        .hub-container.active .sub-node-1 {
            transform: translate(-135px, -115px) scale(1);
            transition-delay: 0.02s;
        }

        /* Top Center Sub Node (Materials Reservation) */
        .sub-node-2 {
            --hover-transform: translate(0px, -160px) scale(1.18);
        }
        .hub-container:hover .sub-node-2,
        .hub-container.active .sub-node-2 {
            transform: translate(0px, -160px) scale(1.08);
            transition-delay: 0.08s;
        }

        /* Right Sub Node (Stock Requisition) */
        .sub-node-3 {
            --hover-transform: translate(135px, -115px) scale(1.12);
        }
        .hub-container:hover .sub-node-3,
        .hub-container.active .sub-node-3 {
            transform: translate(135px, -115px) scale(1);
            transition-delay: 0.14s;
        }

        /* Pulse hint effect around main logo when idle */
        @keyframes subtle-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .pulse-idle {
            animation: subtle-pulse 3s infinite ease-in-out;
        }

        .hub-container:hover .pulse-idle {
            animation: none;
        }
    </style>
</head>
<body class="bg-gradient-to-b from-[#0e5277] via-[#093e5d] to-[#042033] min-h-screen text-white relative overflow-x-hidden flex flex-col justify-between select-none">

    <!-- Header Section -->

    <!-- JavaScript for Dynamic Particle Canvas & Navigation Logic -->
    <script>
        // --- 1. Background Animated Particles ---
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initParticles();
        });

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.radius = Math.random() * 2.5 + 0.5;
                this.alpha = Math.random() * 0.5 + 0.1;
                this.vx = (Math.random() - 0.5) * 0.4;
                this.vy = (Math.random() - 0.5) * 0.4 - 0.2;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > width || this.y < 0 || this.y > height) {
                    this.reset();
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
                ctx.shadowBlur = 10;
                ctx.shadowColor = "rgba(255, 255, 255, 0.8)";
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        let particles = [];
        function initParticles() {
            particles = [];
            const count = Math.min(Math.floor(width * 0.05), 60);
            for (let i = 0; i < count; i++) {
                particles.push(new Particle());
            }
        }

        let step = 0;
        function animate() {
            ctx.clearRect(0, 0, width, height);

            step += 0.005;
            const glowX = width / 2 + Math.sin(step) * 100;
            const glowY = height / 2 + Math.cos(step * 0.7) * 50;

            const radialGlow = ctx.createRadialGradient(glowX, glowY, 50, glowX, glowY, Math.max(width, height) * 0.7);
            radialGlow.addColorStop(0, 'rgba(20, 110, 160, 0.15)');
            radialGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
            
            ctx.fillStyle = radialGlow;
            ctx.fillRect(0, 0, width, height);

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        initParticles();
        animate();

        // --- 2. Mobile / Touch Toggle Support ---
        const hubContainer = document.getElementById('hubContainer');
        const centerLogo = document.getElementById('centerLogo');
        
        centerLogo.addEventListener('click', (e) => {
            hubContainer.classList.toggle('active');
        });

        // Close popups when clicking outside on mobile
        document.addEventListener('click', (e) => {
            if (!hubContainer.contains(e.target)) {
                hubContainer.classList.remove('active');
            }
        });
    </script>
</body>
